name: Smoke

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  compose-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose configuration
        run: docker compose -f docker-compose.yml config --quiet

      - name: Pull published images
        run: |
          docker pull movary/movary-backend:latest
          docker pull movary/movary-frontend:latest
