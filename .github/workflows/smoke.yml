name: Smoke

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  compose-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose configuration
        run: docker compose -f docker-compose.yml config --quiet

      - name: Pull published images (skipped when not yet published)
        run: |
          docker manifest inspect movary/movary-backend:latest >/dev/null 2>&1 && docker pull movary/movary-backend:latest || echo "movary-backend:latest not published yet — skipping"
          docker manifest inspect movary/movary-frontend:latest >/dev/null 2>&1 && docker pull movary/movary-frontend:latest || echo "movary-frontend:latest not published yet — skipping"
